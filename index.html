<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WikiGaleri - Galeri Multimedia Wikimedia Commons</title>
    <meta name="description" content="WikiGaleri: Galeri multimedia Wikimedia Commons responsif untuk mencari, memfilter lisensi, dan mengunduh berkas media terbuka." />
    <meta property="og:title" content="WikiGaleri - Galeri Multimedia Wikimedia Commons" />
    <meta property="og:description" content="WikiGaleri: Galeri multimedia Wikimedia Commons responsif untuk mencari, memfilter lisensi, dan mengunduh berkas media terbuka." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('commonslens_theme');
          const isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
          const lang = localStorage.getItem('commonslens_language') || 'en';
          document.documentElement.lang = lang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100 antialiased selection:bg-accent-600 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
